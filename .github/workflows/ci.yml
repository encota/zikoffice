name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev patchelf \
            poppler-utils mupdf-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Interface — install, type check, tests
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Interface — build
        working-directory: app
        run: npx vite build

      - name: Rust — tests
        run: cargo test
